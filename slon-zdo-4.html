<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перевёртыш 700px</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #fffff;
            font-family: Arial, sans-serif;
        }

        .flip-container {
            width: 700px;
            height: 500px;
            perspective: 1000px;
        }

        .flip-card {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .flip-container:hover .flip-card {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #ffffff;
            box-sizing: border-box;
        }

        .flip-card-front {
            transform: rotateY(0deg);
            background: #ffffff; /* Белый фон для лицевой стороны */
        }

        .flip-card-back {
            transform: rotateY(180deg);
            background: #ffffff; /* Белый фон для оборотной стороны */
        }

        .flip-card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Первая картинка заполняет всю область */
            display: block;
        }

        .flip-card-back img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Вторая картинка влезает целиком */
            display: block;
        }
    </style>
</head>
<body>

<div class="flip-container">
    <div class="flip-card">
        <!-- ЛИЦЕВАЯ СТОРОНА -->
        <div class="flip-card-front">
            <img src="tablitsa4-1.png">
        </div>

        <!-- ОБОРОТНАЯ СТОРОНА -->
        <div class="flip-card-back">
            <img src="tablitsa4-2.png">
        </div>
    </div>
</div>

</body>
</html>
