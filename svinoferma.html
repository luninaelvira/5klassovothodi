<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПЭК на свиноферме — экологический тренажер</title>

    <style>
        /* =========================
           БАЗОВЫЕ СТИЛИ СТРАНИЦЫ
           ========================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.75), transparent 30%),
                linear-gradient(135deg, #e8f5e9 0%, #dcedc8 50%, #c8e6c9 100%);
            color: #263b2b;
            padding: 30px 16px 40px;
        }

        .page {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h1 {
            margin: 0 0 8px;
            color: #245c35;
            font-size: clamp(1.7rem, 4vw, 2.5rem);
            font-weight: 800;
        }

        .header p {
            margin: 0;
            color: #52705b;
            font-size: 1rem;
        }

        /* Контейнер картинки */
        .image-card {
            position: relative;
            width: min(900px, 100%);
            margin: 0 auto;
            padding: 10px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(69, 110, 75, 0.18);
            border-radius: 24px;
            box-shadow:
                0 18px 45px rgba(38, 73, 45, 0.18),
                0 4px 12px rgba(38, 73, 45, 0.1);
            backdrop-filter: blur(8px);
        }

        /* Картинка должна быть заменена пользователем */
        #farmImage {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 17px;
            cursor: default;
        }

        /* Заглушка, показываемая при ошибке загрузки картинки */
        .image-error {
            display: none;
            min-height: 520px;
            border-radius: 17px;
            background:
                linear-gradient(135deg, #dcedc8, #a5d6a7);
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 35px;
            color: #31563a;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .image-error strong {
            display: block;
            margin-bottom: 8px;
            font-size: 1.3rem;
        }

        .hint {
            text-align: center;
            margin: 16px 0 0;
            color: #46664d;
            font-size: 1rem;
            font-weight: 600;
        }

        /* =========================
           МОДАЛЬНОЕ ОКНО
           ========================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background: rgba(19, 42, 25, 0.62);
            backdrop-filter: blur(5px);

            opacity: 0;
            visibility: hidden;
            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .modal-overlay.is-open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            position: relative;
            width: min(680px, 100%);
            max-height: min(80vh, 700px);
            overflow-y: auto;

            background: #ffffff;
            border: 4px solid #7cb342;
            border-radius: 25px;
            padding: 42px 30px 30px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.3),
                0 5px 20px rgba(53, 88, 58, 0.2);

            transform: translateY(20px) scale(0.94);
            opacity: 0;

            transition:
                transform 0.3s cubic-bezier(.2, .8, .2, 1),
                opacity 0.25s ease;
        }

        .modal-overlay.is-open .modal {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 12px;

            width: 42px;
            height: 42px;

            border: 0;
            border-radius: 50%;
            background: #edf6e9;
            color: #416447;

            font-size: 1.35rem;
            font-weight: bold;
            line-height: 1;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .modal-close:hover {
            background: #d7ebd0;
            transform: rotate(5deg) scale(1.06);
        }

        .modal-close:focus-visible {
            outline: 3px solid #81c784;
            outline-offset: 2px;
        }

        .modal-content {
            display: flex;
            align-items: flex-start;
            gap: 16px;

            color: #263b2b;
            font-size: 1.15rem;
            line-height: 1.65;
        }

        .modal-emoji {
            flex: 0 0 auto;
            font-size: 2.4rem;
            line-height: 1;
        }

        .modal-text {
            margin: 0;
        }

        /* =========================
           АДАПТИВНОСТЬ
           ========================= */

        @media (max-width: 600px) {
            body {
                padding: 18px 10px 28px;
            }

            .image-card {
                padding: 6px;
                border-radius: 17px;
            }

            #farmImage,
            .image-error {
                border-radius: 12px;
            }

            .image-error {
                min-height: 400px;
            }

            .modal {
                padding: 42px 20px 24px;
                border-radius: 20px;
            }

            .modal-content {
                font-size: 1.08rem;
                gap: 12px;
            }

            .modal-emoji {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">
        <h1>🌿 ПЭК на свиноферме</h1>
        <p>Экологический тренажер: найди нарушения на территории фермы</p>
    </header>

    <main>

        <div class="image-card">

            <!--
                ВАЖНО:
                Замените значение src ниже на путь к вашей готовой картинке.
                Например:
                src="images/pig-farm.png"
                или
                src="pig-farm.jpg"

                Координаты областей <area> ниже рассчитаны примерно под
                исходное изображение. При необходимости их можно подогнать
                под конкретную картинку.
            -->
            <img
                id="farmImage"
                src="свиноферма.png"
                alt="Мультяшная свиноферма с контейнером, навозом и дренажом"
                usemap="#farmMap"
            >

            <!--
                Эта заглушка автоматически появится, если изображение
                не удалось загрузить.
            -->
            <div id="imageError" class="image-error">
                <div>
                    <strong>🖼️ Картинка не загрузилась</strong>
                    Замените значение <code>src</code> у тега
                    <code>&lt;img id="farmImage"&gt;</code> на путь
                    к вашей картинке свинофермы.
                </div>
            </div>

        </div>

        <p class="hint">
            Нажми на кучку, контейнер, сток или свинку
        </p>

    </main>
</div>


<!--
    ==========================================================
    HTML-КАРТА ИНТЕРАКТИВНЫХ ЗОН

    Координаты заданы примерно для изображения 1068 × 1424 px.
    Если ваша картинка имеет другой размер или объекты расположены
    иначе, измените значения coords.

    JS автоматически масштабирует координаты при изменении размера
    картинки, поэтому карта остается адаптивной.
    ==========================================================
-->
<map name="farmMap" id="farmMap">

    <!-- ЗОНА 1: Кучка какашек / навоза — правая часть -->
    <area
        shape="rect"
        coords="670,470,1060,900"
        href="#"
        data-target="manure"
        title="Кучка навоза 💩"
        alt="Кучка навоза"
    >

    <!-- ЗОНА 2: Зеленый контейнер — левая часть -->
    <area
        shape="rect"
        coords="0,230,390,850"
        href="#"
        data-target="container"
        title="Контейнер с отходами 🟢"
        alt="Контейнер с отходами"
    >

    <!-- ЗОНА 3: Сток / вода у дренажа — нижняя часть -->
    <area
        shape="rect"
        coords="430,800,930,1420"
        href="#"
        data-target="drainage"
        title="Сток / вода у дренажа 💧"
        alt="Сток и вода у дренажа"
    >

    <!-- ЗОНА 4: Любая свинка — центральная часть -->
    <area
        shape="rect"
        coords="340,180,850,570"
        href="#"
        data-target="pig"
        title="Свинка 🐷"
        alt="Свинка"
    >

</map>


<!--
    ==========================================================
    МОДАЛЬНОЕ ОКНО
    ==========================================================
-->
<div
    class="modal-overlay"
    id="modalOverlay"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="modalText"
>
    <div class="modal">

        <!-- Кнопка закрытия -->
        <button
            class="modal-close"
            id="modalClose"
            type="button"
            aria-label="Закрыть окно"
            title="Закрыть"
        >
            ✕
        </button>

        <div class="modal-content">
            <div class="modal-emoji" id="modalEmoji" aria-hidden="true"></div>

            <p class="modal-text" id="modalText"></p>
        </div>

    </div>
</div>


<script>
    /* =========================================================
       ДАННЫЕ ДЛЯ ИНТЕРАКТИВНЫХ ЗОН
       Тексты сохранены в точности по заданию.
       ========================================================= */

    const modalData = {
        manure: {
            emoji: "💩",
            text: 'Тут эколог скажет: "Почему побочные продукты животноводства лежат не на спецплощадке? Их признают отходами! Но и как отход, навоз, лежащий на открытом грунте - это грубое нарушение!"'
        },

        container: {
            emoji: "🟢",
            text: 'Тут эколог скажет: "Почему контейнер с отходами расположен рядом с животными, не на спец площадке? Почему он стоит на открытом грунте, без маркировки, где ограждение с трех сторон?"'
        },

        drainage: {
            emoji: "💧",
            text: 'Тут эколог скажет: "Почему у вас стоки без очистки? Почему сток идет в овраг на рельеф?"'
        },

        pig: {
            emoji: "🐷",
            text: 'Тут эколог скажет: "Какие они милые!"'
        }
    };


    /* =========================================================
       ПОЛУЧЕНИЕ ЭЛЕМЕНТОВ СТРАНИЦЫ
       ========================================================= */

    const image = document.getElementById("farmImage");
    const imageError = document.getElementById("imageError");

    const modalOverlay = document.getElementById("modalOverlay");
    const modalClose = document.getElementById("modalClose");
    const modalEmoji = document.getElementById("modalEmoji");
    const modalText = document.getElementById("modalText");

    const areas = document.querySelectorAll("#farmMap area");


    /* =========================================================
       ОБРАБОТКА ОШИБКИ ЗАГРУЗКИ КАРТИНКИ
       ========================================================= */

    image.addEventListener("error", function () {
        image.style.display = "none";
        imageError.style.display = "flex";
    });

    image.addEventListener("load", function () {
        image.style.display = "block";
        imageError.style.display = "none";

        // После загрузки пересчитываем координаты интерактивных зон.
        updateMapCoordinates();
    });


    /* =========================================================
       ОТКРЫТИЕ МОДАЛЬНОГО ОКНА
       ========================================================= */

    function openModal(target) {
        const data = modalData[target];

        if (!data) {
            return;
        }

        modalEmoji.textContent = data.emoji;
        modalText.textContent = data.text;

        modalOverlay.classList.add("is-open");
        modalOverlay.setAttribute("aria-hidden", "false");

        // Запоминаем элемент, с которого пользователь открыл окно.
        document.activeElement.blur();

        // Фокус на кнопку закрытия для удобной навигации с клавиатуры.
        setTimeout(function () {
            modalClose.focus();
        }, 50);

        // Запрещаем прокрутку страницы под модальным окном.
        document.body.style.overflow = "hidden";
    }


    /* =========================================================
       ЗАКРЫТИЕ МОДАЛЬНОГО ОКНА
       ========================================================= */

    function closeModal() {
        modalOverlay.classList.remove("is-open");
        modalOverlay.setAttribute("aria-hidden", "true");

        // Возвращаем обычную прокрутку страницы.
        document.body.style.overflow = "";
    }


    /* =========================================================
       ОБРАБОТКА КЛИКОВ ПО AREA
       ========================================================= */

    areas.forEach(function (area) {

        area.addEventListener("click", function (event) {
            event.preventDefault();

            const target = area.getAttribute("data-target");

            openModal(target);
        });

        /*
            У <area> нет полноценного CSS :hover во всех браузерах,
            поэтому курсор задаем через JS при наведении.
        */
        area.addEventListener("mouseenter", function () {
            image.style.cursor = "pointer";
        });

        area.addEventListener("mouseleave", function () {
            image.style.cursor = "default";
        });
    });


    /* =========================================================
       ЗАКРЫТИЕ ПО КРЕСТИКУ
       ========================================================= */

    modalClose.addEventListener("click", function () {
        closeModal();
    });


    /* =========================================================
       ЗАКРЫТИЕ ПО КЛИКУ НА ЗАТЕМНЕННЫЙ ФОН
       ========================================================= */

    modalOverlay.addEventListener("click", function (event) {

        // Закрываем только при клике именно на overlay,
        // а не на само белое окно.
        if (event.target === modalOverlay) {
            closeModal();
        }
    });


    /* =========================================================
       ЗАКРЫТИЕ ПО КЛАВИШЕ ESC
       ========================================================= */

    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape" && modalOverlay.classList.contains("is-open")) {
            closeModal();
        }
    });


    /* =========================================================
       АДАПТИВНОЕ МАСШТАБИРОВАНИЕ КООРДИНАТ КАРТЫ

       Исходные coords рассчитаны под базовый размер 1068 × 1424.
       Если браузер уменьшает изображение, координаты <area>
       автоматически масштабируются пропорционально.

       Если у вашей картинки другой исходный размер, поменяйте
       BASE_WIDTH и BASE_HEIGHT ниже.
       ========================================================= */

    const BASE_WIDTH = 1068;
    const BASE_HEIGHT = 1424;

    // Сохраняем первоначальные координаты каждой области.
    areas.forEach(function (area) {
        area.dataset.originalCoords = area.getAttribute("coords");
    });


    function updateMapCoordinates() {

        if (!image.complete || !image.naturalWidth || !image.naturalHeight) {
            return;
        }

        /*
            Используем фактический размер картинки как основу.
            Если ваша готовая картинка имеет размер 1068 × 1424,
            коэффициенты будут корректными сразу.
        */
        const displayedWidth = image.clientWidth;
        const displayedHeight = image.clientHeight;

        if (!displayedWidth || !displayedHeight) {
            return;
        }

        const scaleX = displayedWidth / BASE_WIDTH;
        const scaleY = displayedHeight / BASE_HEIGHT;

        areas.forEach(function (area) {

            const original = area.dataset.originalCoords;

            if (!original) {
                return;
            }

            const coordinates = original
                .split(",")
                .map(Number);

            const scaled = coordinates.map(function (value, index) {

                // Четные индексы — X, нечетные — Y.
                return Math.round(
                    value * (index % 2 === 0 ? scaleX : scaleY)
                );
            });

            area.setAttribute("coords", scaled.join(","));
        });
    }


    /* =========================================================
       ПЕРЕСЧЕТ КООРДИНАТ ПРИ ИЗМЕНЕНИИ РАЗМЕРА ОКНА
       ========================================================= */

    window.addEventListener("resize", updateMapCoordinates);

    window.addEventListener("orientationchange", function () {
        setTimeout(updateMapCoordinates, 100);
    });


    /* =========================================================
       ДОПОЛНИТЕЛЬНАЯ ИНИЦИАЛИЗАЦИЯ
       ========================================================= */

    if (image.complete) {
        if (image.naturalWidth > 0) {
            updateMapCoordinates();
        } else {
            image.style.display = "none";
            imageError.style.display = "flex";
        }
    }
</script>

</body>
</html>
