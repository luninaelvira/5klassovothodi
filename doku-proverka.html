<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Итоговые документы проверки — тренажёр</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --ok-bg: #ecfdf5;
    --ok-border: #10b981;
    --err-bg: #fef2f2;
    --err-border: #ef4444;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }

  .app {
    width: 100%;
    max-width: 720px;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,.08);
  }

  .progress {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .bar {
    height: 6px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .bar > div {
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width .3s ease;
  }

  h2 {
    margin: 0 0 18px;
    font-size: 20px;
    line-height: 1.4;
  }

  .options {
    display: grid;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-size: 15px;
  }

  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: #f8faff;
  }

  .option input {
    margin-top: 3px;
    accent-color: var(--accent);
  }

  .option.disabled {
    cursor: default;
    opacity: .75;
  }

  .option.correct {
    border-color: var(--ok-border);
    background: var(--ok-bg);
    opacity: 1;
  }

  .option.wrong {
    border-color: var(--err-border);
    background: var(--err-bg);
    opacity: 1;
  }

  .comment {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.5;
    display: none;
  }

  .comment.show { display: block; }

  .comment.ok {
    background: var(--ok-bg);
    border-left: 4px solid var(--ok-border);
  }

  .comment.err {
    background: var(--err-bg);
    border-left: 4px solid var(--err-border);
  }

  .comment strong { display: block; margin-bottom: 4px; }

  .btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }

  .btn:hover { background: var(--accent-hover); }

  .btn:disabled {
    background: #cbd5e1;
    cursor: not-allowed;
  }

  .hide { display: none; }

  .final-score {
    font-size: 40px;
    font-weight: 700;
    color: var(--accent);
    margin: 10px 0;
  }

  .final-text {
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="progress" id="progress"></div>
    <div class="bar"><div id="bar"></div></div>

    <div id="question-view">
      <h2 id="question-text"></h2>
      <div class="options" id="options"></div>
      <div class="comment" id="comment"></div>
      <button class="btn" id="next-btn" disabled>Далее</button>
    </div>

    <div id="result-view" class="hide">
      <h2>Готово!</h2>
      <p class="final-text">Вы правильно ответили на</p>
      <div class="final-score" id="score"></div>
      <p class="final-text" id="score-caption"></p>
      <button class="btn" id="restart-btn">Пройти заново</button>
    </div>
  </div>
</div>

<script>
  const questions = [
    {
      text: "Инспектор завершил выездную проверку. Нарушений не выявлено. Какой документ он оформит?",
      options: [
        "Акт контрольного мероприятия",
        "Предостережение о недопустимости нарушения",
        "Предписание",
        "Постановление об административном правонарушении"
      ],
      correct: 0,
      comment: "Акт оформляется по итогам любой проверки, даже если нарушений не выявлено."
    },
    {
      text: "Инспектор заметил, что организация вовремя не уведомила Росприроднадзор о начале строительства, но вреда здоровью людей и окружающей среде нет. Какой документ он составит?",
      options: [
        "Протокол",
        "Предостережение о недопустимости нарушения",
        "Постановление об административном правонарушении",
        "Определение о проведении административного расследования"
      ],
      correct: 1,
      comment: "Предостережение выдают, когда вреда ещё нет, но есть риск нарушения обязательных требований."
    },
    {
      text: "Во время проверки инспектор обнаружил стационарный источник выбросов, не поставленный на учёт, и потребовал устранить это в конкретный срок. Какой документ он выдаст?",
      options: [
        "Предостережение",
        "Акт контрольного мероприятия",
        "Предписание",
        "Определение о возбуждении дела"
      ],
      correct: 2,
      comment: "Предписание оформляют, если нарушение происходит в момент проверки: в нём указывают суть нарушения и срок устранения."
    },
    {
      text: "Инспектор выявил нарушение статьи КоАП и принял решение привлечь предприятие к административной ответственности. Какой документ он оформит?",
      options: [
        "Протокол",
        "Предписание",
        "Постановление об административном правонарушении",
        "Предостережение"
      ],
      correct: 2,
      comment: "Постановление оформляют, когда принято решение привлечь организацию или должностное лицо к административной ответственности."
    },
    {
      text: "Инспектору нужно подробно описать суть нарушения и то, как оно было выявлено, сразу на месте. Какой документ он составит?",
      options: [
        "Акт контрольного мероприятия",
        "Протокол",
        "Предписание",
        "Постановление"
      ],
      correct: 1,
      comment: "Протокол фиксирует суть нарушения и способ его выявления. Его могут составить как сразу на месте, так и позже — по результатам исследований."
    },
    {
      text: "Для подтверждения нарушения нужна экспертиза проб, которая займёт много времени, и есть риск вреда окружающей среде. Что оформит инспектор?",
      options: [
        "Предостережение",
        "Предписание",
        "Определение о возбуждении дела об административном правонарушении и проведении административного расследования",
        "Акт контрольного мероприятия"
      ],
      correct: 2,
      comment: "Административное расследование проводят, когда нужна экспертиза или исследование и есть риск вреда окружающей среде. Его оформляют определением."
    },
    {
      text: "Инспектор отобрал пробы и отправил их на исследование. По результатам исследования подтвердилось нарушение. Какой документ он составит?",
      options: [
        "Предостережение",
        "Протокол",
        "Акт контрольного мероприятия",
        "Предписание"
      ],
      correct: 1,
      comment: "Протокол могут составить не сразу на месте, а позже — по результатам исследования отобранных проб и документов."
    },
    {
      text: "Инспектор выявил нарушение, но пока не принял решение о наказании — нужно дополнительное исследование документов. Какой документ он составит в первую очередь?",
      options: [
        "Постановление",
        "Предостережение",
        "Протокол",
        "Предписание"
      ],
      correct: 2,
      comment: "Сначала фиксируют нарушение в протоколе. Предписание и постановление могут последовать позже, в зависимости от ситуации."
    }
  ];

  let current = 0;
  let score = 0;
  let answered = false;

  const progressEl = document.getElementById("progress");
  const barEl = document.getElementById("bar");
  const questionTextEl = document.getElementById("question-text");
  const optionsEl = document.getElementById("options");
  const commentEl = document.getElementById("comment");
  const nextBtn = document.getElementById("next-btn");
  const questionView = document.getElementById("question-view");
  const resultView = document.getElementById("result-view");
  const scoreEl = document.getElementById("score");
  const scoreCaption = document.getElementById("score-caption");
  const restartBtn = document.getElementById("restart-btn");

  function renderQuestion() {
    answered = false;
    const q = questions[current];

    progressEl.textContent = `Вопрос ${current + 1} из ${questions.length}`;
    barEl.style.width = `${(current / questions.length) * 100}%`;

    questionTextEl.textContent = q.text;
    optionsEl.innerHTML = "";
    commentEl.className = "comment";
    commentEl.innerHTML = "";
    nextBtn.disabled = true;
    nextBtn.textContent = current === questions.length - 1 ? "Показать результат" : "Далее";

    q.options.forEach((opt, i) => {
      const label = document.createElement("label");
      label.className = "option";
      label.innerHTML = `
        <input type="radio" name="answer" value="${i}">
        <span>${opt}</span>
      `;
      optionsEl.appendChild(label);
    });

    optionsEl.querySelectorAll("input").forEach(input => {
      input.addEventListener("change", () => handleAnswer(Number(input.value)));
    });
  }

  function handleAnswer(selected) {
    if (answered) return;
    answered = true;

    const q = questions[current];
    const isCorrect = selected === q.correct;

    if (isCorrect) score++;

    // Подсветка вариантов
    const labels = optionsEl.querySelectorAll(".option");
    labels.forEach((label, i) => {
      label.classList.add("disabled");
      const input = label.querySelector("input");
      input.disabled = true;

      if (i === q.correct) label.classList.add("correct");
      if (i === selected && !isCorrect) label.classList.add("wrong");
    });

    // Комментарий
    commentEl.className = `comment show ${isCorrect ? "ok" : "err"}`;
    commentEl.innerHTML = `
      <strong>${isCorrect ? "Верно!" : "Не совсем."}</strong>
      ${q.comment}
    `;

    nextBtn.disabled = false;
  }

  nextBtn.addEventListener("click", () => {
    current++;
    if (current < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  });

  function showResult() {
    questionView.classList.add("hide");
    resultView.classList.remove("hide");
    barEl.style.width = "100%";
    progressEl.textContent = "Задание завершено";

    scoreEl.textContent = `${score} / ${questions.length}`;

    const percent = Math.round((score / questions.length) * 100);
    let caption = "";
    if (percent === 100) caption = "Отлично! Вы уверенно различаете итоговые документы проверки.";
    else if (percent >= 75) caption = "Хороший результат. Осталось закрепить пару моментов.";
    else if (percent >= 50) caption = "Неплохо, но стоит повторить, чем отличаются предписание, предостережение и протокол.";
    else caption = "Есть смысл вернуться к уроку и ещё раз разобрать виды документов.";

    scoreCaption.textContent = caption;
  }

  restartBtn.addEventListener("click", () => {
    current = 0;
    score = 0;
    answered = false;
    resultView.classList.add("hide");
    questionView.classList.remove("hide");
    renderQuestion();
  });

  renderQuestion();
</script>
</body>
</html>
