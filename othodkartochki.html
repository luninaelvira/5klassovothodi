<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Эко-слайдер | классы опасности отходов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            padding: 16px;
        }

        /* Контейнер — теперь резиновый, но с сохранением пропорций */
        .slider-container {
            width: 100%;
            max-width: 700px;
            height: auto;
            aspect-ratio: 700 / 500; /* сохраняем исходные пропорции 700x500 */
            position: relative;
            border-radius: clamp(28px, 6vw, 44px);
            background: rgba(255, 248, 240, 0.3);
            box-shadow: 0 25px 40px -16px rgba(0, 0, 0, 0.35), inset 0 1px 2px rgba(255,255,245,0.7);
            backdrop-filter: blur(2px);
            overflow: hidden;
        }

        .cards-slider {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            border-radius: inherit;
            background: #fef7ed;
            scrollbar-width: thin;
            scrollbar-color: #c9ada1 #f2e0ce;
            -webkit-overflow-scrolling: touch;
        }
        .cards-slider::-webkit-scrollbar {
            height: 4px;
        }
        .cards-slider::-webkit-scrollbar-track {
            background: #f2e0ce;
            border-radius: 12px;
            margin: 0 20px;
        }
        .cards-slider::-webkit-scrollbar-thumb {
            background: #b68b7a;
            border-radius: 12px;
        }

        .card {
            flex: 0 0 100%;
            scroll-snap-align: start;
            width: 100%;
            height: 100%;
            padding: clamp(16px, 4vw, 26px) clamp(18px, 5vw, 30px) clamp(20px, 5vw, 30px) clamp(18px, 5vw, 30px);
            display: flex;
            flex-direction: column;
            transition: background 0.25s;
            overflow-y: auto;
        }
        /* Плавный скролл внутри карточки */
        .card::-webkit-scrollbar {
            width: 3px;
        }
        .card::-webkit-scrollbar-track {
            background: #eedbcb;
            border-radius: 10px;
        }
        .card::-webkit-scrollbar-thumb {
            background: #b48b72;
            border-radius: 10px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2.5vw, 14px);
            margin-bottom: clamp(14px, 3.5vw, 1.6rem);
            border-bottom: 2px solid rgba(100, 70, 55, 0.2);
            padding-bottom: clamp(8px, 2vw, 12px);
            flex-shrink: 0;
        }
        .class-icon {
            font-size: clamp(1.8rem, 7vw, 2.6rem);
            filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.1));
            background: rgba(255,250,225,0.6);
            width: clamp(44px, 12vw, 58px);
            height: clamp(44px, 12vw, 58px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            flex-shrink: 0;
        }
        .card-title {
            font-size: clamp(1.25rem, 5vw, 1.85rem);
            font-weight: 580;
            letter-spacing: -0.3px;
            color: #2d3e3f;
            text-shadow: 0 1px 0 rgba(255,255,230,0.6);
            line-height: 1.2;
        }

        .examples-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: clamp(10px, 3vw, 18px);
            align-content: start;
            margin-top: 4px;
        }

        /* flip-карточки — адаптивная высота */
        .flip-card {
            background-color: transparent;
            height: clamp(58px, 12vw, 72px);
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            border-radius: 60px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .flipped .flip-inner {
            transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 clamp(10px, 3vw, 18px);
            gap: clamp(8px, 2.5vw, 14px);
            background: rgba(255, 250, 240, 0.85);
            backdrop-filter: blur(3px);
            border: 1px solid rgba(210, 180, 140, 0.45);
            box-sizing: border-box;
        }
        .flip-front {
            background: rgba(253, 245, 230, 0.9);
            color: #2b4a3b;
            font-weight: 500;
        }
        .flip-back {
            background: #fef3e4;
            transform: rotateY(180deg);
            font-weight: 500;
            color: #2d4a3e;
            font-size: clamp(0.7rem, 2.8vw, 0.88rem);
            justify-content: flex-start;
            word-break: break-word;
        }
        .example-icon {
            font-size: clamp(1.2rem, 5vw, 1.7rem);
            min-width: clamp(28px, 8vw, 44px);
            text-align: center;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.1));
        }
        .front-text-placeholder {
            font-size: clamp(0.7rem, 3vw, 0.9rem);
            font-weight: 500;
            color: #7b5f4b;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* навигация — всегда удобно на телефоне */
        .navigation {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: clamp(12px, 4vw, 20px);
            z-index: 12;
            background: rgba(245, 235, 220, 0.8);
            backdrop-filter: blur(16px);
            padding: 6px 18px;
            border-radius: 60px;
            pointer-events: auto;
            border: 0.5px solid rgba(255,245,215,0.9);
            width: auto;
            white-space: nowrap;
        }
        .nav-btn {
            background: #f1e3d4;
            border: none;
            width: clamp(38px, 12vw, 48px);
            height: clamp(38px, 12vw, 48px);
            border-radius: 60px;
            font-size: clamp(1.4rem, 5vw, 1.9rem);
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #846b56;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .nav-btn:active {
            transform: scale(0.94);
            background: #ffe0c4;
        }
        .dots {
            position: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 11;
            pointer-events: none;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #c3aa95;
            border-radius: 50%;
            transition: all 0.2s;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .dot.active {
            background: #6f4f3a;
            width: 24px;
            border-radius: 20px;
        }

        /* планшеты и телефоны: если экран узкий, уменьшаем отступы */
        @media (max-width: 550px) {
            .card {
                padding: 14px 16px 20px 16px;
            }
            .front-text-placeholder {
                white-space: normal;
                font-size: 0.68rem;
            }
            .flip-front, .flip-back {
                gap: 6px;
            }
            .examples-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .flip-card {
                height: 62px;
            }
        }

        /* для очень маленьких экранов */
        @media (max-width: 420px) {
            .class-icon {
                width: 40px;
                height: 40px;
                font-size: 1.6rem;
            }
            .card-title {
                font-size: 1.1rem;
            }
            .flip-back {
                font-size: 0.68rem;
                padding: 0 10px;
            }
        }

        /* но если достаточно широко, то две колонки выглядят отлично */
        @media (min-width: 600px) {
            .examples-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .card {
            scrollbar-width: thin;
        }
        .example-icon {
            transition: transform 0.1s;
        }
        .flip-card:hover .example-icon {
            transform: scale(1.03);
        }
    </style>
</head>
<body>
<div class="slider-container">
    <div class="cards-slider" id="cardsSlider"></div>
    <div class="navigation">
        <button class="nav-btn" id="prevBtn" aria-label="Предыдущая карточка">←</button>
        <button class="nav-btn" id="nextBtn" aria-label="Следующая карточка">→</button>
    </div>
    <div class="dots" id="dotsContainer"></div>
</div>

<script>
    // ============  ДАННЫЕ С УНИФИЦИРОВАННЫМИ ИКОНКАМИ ЗАГОЛОВКОВ (только одна) ============
    const cardsData = [
        {
            classNumber: "I",
            title: "Отходы I класса опасности",
            mainIcon: "☠️",
            examples: [
                { text: "ртутьсодержащие отходы", icon: "💧🌡️" },
                { text: "трансформаторы и конденсаторы на ПХД", icon: "⚡🧪" },
                { text: "стройматериалы с асбестом", icon: "🏚️⚠️" },
                { text: "соли мышьяка", icon: "⚗️💀" },
                { text: "пестициды на основе хлорорганики", icon: "🧪🐛" },
                { text: "концентрированные кислоты и щелочи", icon: "⚗️🔥" }
            ]
        },
        {
            classNumber: "II",
            title: "Отходы II класса опасности",
            mainIcon: "⚠️",
            examples: [
                { text: "автоаккумуляторы свинцовые", icon: "🚗🔋" },
                { text: "смесь жидких пестицидов", icon: "🧪🐛" },
                { text: "семена зерновых, протравленные фунгицидами", icon: "🌾🧴" },
                { text: "кислотные и щелочные электролиты", icon: "🧫⚗️" },
                { text: "гудрон кислый", icon: "🛢️⚠️" },
                { text: "расплав электролита алюминиевого производства", icon: "🏭🔥" }
            ]
        },
        {
            classNumber: "III",
            title: "Отходы III класса опасности",
            mainIcon: "🛢️",
            examples: [
                { text: "нефтешламы", icon: "🛢️💧" },
                { text: "отходы моющих средств", icon: "🧼🧴" },
                { text: "табачная пыль", icon: "🚬🍂" },
                { text: "свежий куриный помет", icon: "🐔💩" },
                { text: "свежий свиной навоз", icon: "🐷💨" },
                { text: "гербицид на основе диметахлора", icon: "🌿🧪" },
                { text: "покрышки автомобильные", icon: "🚗⚙️" },
                { text: "промасленная ветошь", icon: "🧵🛢️" }
            ]
        },
        {
            classNumber: "IV",
            title: "Отходы IV класса опасности",
            mainIcon: "🗑️",
            examples: [
                { text: "компьютерный монитор", icon: "🖥️📺" },
                { text: "пищевые отходы кухонь", icon: "🍌🍚" },
                { text: "шлам нейтрализации сточных вод", icon: "💧🏭" },
                { text: "мусор от офисных и бытовых помещений", icon: "🗑️📄" },
                { text: "перепревший навоз КРС", icon: "🐄🌿" },
                { text: "пыль газоочистки щебеночная", icon: "🏭🌫️" },
                { text: "навоз конский свежий", icon: "🐎💨" },
                { text: "навоз мелкого рогатого скота свежий", icon: "🐑💨" }
            ]
        },
        {
            classNumber: "V",
            title: "Отходы V класса опасности",
            mainIcon: "♻️",
            examples: [
                { text: "стеклянная тара", icon: "🥃♻️" },
                { text: "офисная бумага", icon: "📄♻️" },
                { text: "древесная стружка", icon: "🌳✨" },
                { text: "семена с истекшим сроком годности", icon: "🌾⏳" },
                { text: "силос", icon: "🌽🥫" },
                { text: "скорлупа яиц", icon: "🥚🐣" },
                { text: "незагрязненная упаковка ПЭТ", icon: "🧴✅" },
                { text: "стебли подсолнечника", icon: "🌻🌿" }
            ]
        }
    ];

    // Пастельные градиенты (от красноватого до голубого)
    const pastelGradients = [
        "linear-gradient(135deg, #ffe0db 0%, #ffd1c4 100%)",
        "linear-gradient(135deg, #ffe6cf 0%, #ffdbb5 100%)",
        "linear-gradient(135deg, #f9efcf 0%, #f5e2b8 100%)",
        "linear-gradient(135deg, #daf1e4 0%, #c8e6da 100%)",
        "linear-gradient(135deg, #d2eaf5 0%, #c0def0 100%)"
    ];

    const sliderEl = document.getElementById('cardsSlider');
    const dotsContainer = document.getElementById('dotsContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    let currentIndex = 0;
    const totalCards = cardsData.length;

    // Создание карточек с flip-эффектом
    function buildCards() {
        sliderEl.innerHTML = '';
        cardsData.forEach((card, idx) => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            cardDiv.style.background = pastelGradients[idx];
            cardDiv.style.borderRadius = 'inherit';
            cardDiv.style.boxShadow = 'inset 0 0 0 1px rgba(255,250,210,0.7), 0 4px 12px rgba(0,0,0,0.05)';

            // Шапка
            const header = document.createElement('div');
            header.className = 'card-header';
            const iconSpan = document.createElement('div');
            iconSpan.className = 'class-icon';
            iconSpan.innerText = card.mainIcon;
            const titleSpan = document.createElement('div');
            titleSpan.className = 'card-title';
            titleSpan.innerText = card.title;
            header.appendChild(iconSpan);
            header.appendChild(titleSpan);

            // Сетка примеров
            const grid = document.createElement('div');
            grid.className = 'examples-grid';

            card.examples.forEach(example => {
                const flipContainer = document.createElement('div');
                flipContainer.className = 'flip-card';
                const flipInner = document.createElement('div');
                flipInner.className = 'flip-inner';

                // Передняя сторона (иконка + "нажми")
                const front = document.createElement('div');
                front.className = 'flip-front';
                const iconElem = document.createElement('span');
                iconElem.className = 'example-icon';
                iconElem.innerText = example.icon;
                const hintSpan = document.createElement('span');
                hintSpan.className = 'front-text-placeholder';
                hintSpan.innerText = '👆 нажми';
                front.appendChild(iconElem);
                front.appendChild(hintSpan);

                // Задняя сторона (иконка + полное название)
                const back = document.createElement('div');
                back.className = 'flip-back';
                const backIcon = document.createElement('span');
                backIcon.className = 'example-icon';
                backIcon.innerText = example.icon;
                const backText = document.createElement('span');
                backText.innerText = example.text;
                backText.style.flex = '1';
                backText.style.textAlign = 'left';
                back.appendChild(backIcon);
                back.appendChild(backText);

                flipInner.appendChild(front);
                flipInner.appendChild(back);
                flipContainer.appendChild(flipInner);

                // Клик — переворот
                flipContainer.addEventListener('click', (e) => {
                    e.stopPropagation();
                    flipContainer.classList.toggle('flipped');
                });

                grid.appendChild(flipContainer);
            });

            cardDiv.appendChild(header);
            cardDiv.appendChild(grid);
            sliderEl.appendChild(cardDiv);
        });
    }

    // Построение точек навигации
    function buildDots() {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalCards; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === currentIndex) dot.classList.add('active');
            dot.addEventListener('click', () => scrollToCard(i));
            dotsContainer.appendChild(dot);
        }
    }

    function scrollToCard(index) {
        if (index < 0) index = 0;
        if (index >= totalCards) index = totalCards - 1;
        const cardWidth = sliderEl.clientWidth;
        if (cardWidth === 0) return;
        sliderEl.scrollTo({
            left: cardWidth * index,
            behavior: 'smooth'
        });
        currentIndex = index;
        updateDotsActive();
    }

    function updateDotsActive() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, idx) => {
            if (idx === currentIndex) dot.classList.add('active');
            else dot.classList.remove('active');
        });
    }

    // Синхронизация индекса при скролле
    function syncIndexFromScroll() {
        const scrollLeft = sliderEl.scrollLeft;
        const cardWidth = sliderEl.clientWidth;
        if (cardWidth === 0) return;
        const newIndex = Math.round(scrollLeft / cardWidth);
        if (newIndex !== currentIndex && newIndex >= 0 && newIndex < totalCards) {
            currentIndex = newIndex;
            updateDotsActive();
        }
    }

    function nextCard() {
        if (currentIndex < totalCards - 1) scrollToCard(currentIndex + 1);
        else scrollToCard(totalCards - 1);
    }

    function prevCard() {
        if (currentIndex > 0) scrollToCard(currentIndex - 1);
        else scrollToCard(0);
    }

    // Инициализация
    function init() {
        buildCards();
        buildDots();
        // Устанавливаем начальную позицию
        setTimeout(() => {
            sliderEl.scrollLeft = 0;
            currentIndex = 0;
            updateDotsActive();
            syncIndexFromScroll();
        }, 20);

        let scrollTimeout;
        sliderEl.addEventListener('scroll', () => {
            if (scrollTimeout) clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => syncIndexFromScroll(), 15);
        });
        sliderEl.addEventListener('scrollend', () => syncIndexFromScroll());
        sliderEl.addEventListener('touchend', () => setTimeout(() => syncIndexFromScroll(), 30));

        prevBtn.addEventListener('click', prevCard);
        nextBtn.addEventListener('click', nextCard);

        // При изменении ориентации или ресайзе — корректируем позицию
        window.addEventListener('resize', () => {
            setTimeout(() => {
                if (sliderEl.clientWidth > 0) {
                    scrollToCard(currentIndex);
                }
            }, 60);
        });
    }

    init();

    // Небольшие дополнительные стили для адаптивного удобства
    const styleExtra = document.createElement('style');
    styleExtra.textContent = `
        .flip-card {
            transition: transform 0.1s ease;
        }
        @media (hover: hover) {
            .flip-card:hover {
                transform: scale(1.01);
            }
        }
        .flip-front, .flip-back {
            transition: all 0.2s;
        }
        .example-icon {
            transition: transform 0.1s;
        }
        /* для тач-устройств активная область */
        .flip-card:active {
            transform: scale(0.99);
        }
    `;
    document.head.appendChild(styleExtra);
</script>
</body>
</html>
