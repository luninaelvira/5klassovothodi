body {

.container {

h1 {

.question-text {

.options { list-style: none; }

.option {

.option:hover {

}

.option.selected-correct {

    border-color: #007760;

}

.option.selected-wrong {
    background-color: #f8d7da;
    border-color: #c73241;
    color: #721c24;
}

.option.show-correct {
    background-color: #d4edda;
    border-color: #007760;
    color: #155724;
}

.option.disabled {
    cursor: default;
    pointer-events: none;
}

.feedback {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 0.9em;
    display: none;
}

.feedback.correct {
    background-color: #d4edda;
    border: 1px solid #007760;
}

.feedback.wrong {
    background-color: #f8d7da;
    border: 1px solid #c73241;
}

.feedback-title {
    font-weight: 600;
    margin-bottom: 4px;
}

.feedback-text {
    color: #444;
}

.score {
    text-align: center;
    font-size: 1.3em;
    color: #007760;
    font-weight: 600;
    margin-bottom: 10px;

.score-detail {
    text-align: center;
    font-size: 1.05em;
    margin-bottom: 8px;

.score-message {
    text-align: center;
    font-size: 0.95em;
    color: #666;
    margin-bottom: 20px;

.progress {

    font-size: 0.85em;
    color: #999;

            "Б — верно. Согласно п. 240 СанПиН 2.1.3684-21, извлечение ВМР из ТКО и его сортировка должны проводиться на мусоросортировочных предприятиях.",
            "В — неверно. Согласно п. 240 СанПиН 2.1.3684-21, извлечение ВМР из ТКО и его сортировка должны проводиться на мусоросортировочных предприятиях.",
            "Г — неверно. Согласно п. 240 СанПиН 2.1.3684-21, извлечение ВМР из ТКО и его сортировка должны проводиться на мусоросортировочных предприятиях."
        ]
    },
    {
        q: "Что должна содержать маркировка тары для накопления отходов?",
        options: [
            "А) Только наименование отхода",
            "Б) Только класс опасности отхода",
            "В) Наименование и класс опасности отхода",
            "Г) Наименование отхода, класс опасности и дату накопления"
        ],
        correct: 2,
        feedback: [
            "А — неверно. Только наименование отхода без указания других характеристик не соответствует п. 218 СанПиН 2.1.3684-21.",
            "Б — неверно. Только класс опасности отхода без других данных не полностью характеризует отходы согласно п. 218 СанПиН 2.1.3684-21.",
            "В — верно. Согласно п. 218 СанПиН 2.1.3684-21, тара для селективного сбора и накопления отдельных разновидностей отходов должна иметь маркировку, характеризующую находящихся в ней отходов – достаточно наименования и класса опасности отхода.",
            "Г — неверно. Дата накопления не указана в п. 218 СанПиН 2.1.3684-21 как обязательный элемент маркировки тары для производственных отходов."
        ]
    }
];

let answers = [];

function startTest() {
    document.getElementById("start-screen").classList.remove("active");
    document.getElementById("test-screen").classList.add("active");
    answers = new Array(questions.length).fill(null);
    renderQuestions();
    updateProgress();
}

function renderQuestions() {
    const container = document.getElementById("questions-container");
    container.innerHTML = "";
    questions.forEach((q, i) => {
        const block = document.createElement("div");
        block.className = "question-block";
        block.id = "q-" + i;

        let html = '<div class="question-number">Вопрос ' + (i + 1) + ' из ' + questions.length + '</div>';
        html += '<div class="question-text">' + q.q + '</div>';
        html += '<ul class="options">';
        q.options.forEach((opt, j) => {
            html += '<li class="option" id="q' + i + 'o' + j + '" onclick="selectAnswer(' + i + ', ' + j + ')">' + opt + '</li>';
        });
        html += '</ul>';
        html += '<div class="feedback" id="feedback-' + i + '"></div>';
        block.innerHTML = html;
        container.appendChild(block);
    });
}

function selectAnswer(qIdx, optIdx) {
    if (answers[qIdx] !== null) return;
    answers[qIdx] = optIdx;
    const q = questions[qIdx];
    const isCorrect = optIdx === q.correct;

    // Disable all options for this question
    for (let j = 0; j < q.options.length; j++) {
        const el = document.getElementById("q" + qIdx + "o" + j);
        el.classList.add("disabled");
    }

    // Mark selected
    const selectedEl = document.getElementById("q" + qIdx + "o" + optIdx);
    if (isCorrect) {
        selectedEl.classList.add("selected-correct");
    } else {
        selectedEl.classList.add("selected-wrong");
        // Show correct answer
        document.getElementById("q" + qIdx + "o" + q.correct).classList.add("show-correct");
    }

    // Show feedback
    const fb = document.getElementById("feedback-" + qIdx);
    fb.style.display = "block";
    if (isCorrect) {
        fb.className = "feedback correct";
        fb.innerHTML = '<div class="feedback-title">Верно!</div><div class="feedback-text">' + q.feedback[optIdx] + '</div>';
    } else {
        fb.className = "feedback wrong";
        const correctLetter = ["А", "Б", "В", "Г"][q.correct];
        fb.innerHTML = '<div class="feedback-title">Неверно. Правильный ответ: ' + correctLetter + '</div><div class="feedback-text">' + q.feedback[optIdx] + '</div>';
    }

    updateProgress();
}

function updateProgress() {
    const answered = answers.filter(a => a !== null).length;
    document.getElementById("progress").textContent = "Отвечено: " + answered + " из " + questions.length;
    if (answered === questions.length) {
        document.getElementById("finish-btn").style.display = "block";
    }
}

function showResult() {
    document.getElementById("test-screen").classList.remove("active");
    document.getElementById("result-screen").classList.add("active");
    const correctCount = answers.filter((a, i) => a === questions[i].correct).length;
    document.getElementById("score-text").textContent = "Ваш результат";
    document.getElementById("score-detail").textContent = correctCount + " из " + questions.length + " правильных ответов";
    let msg;
    if (correctCount === 13) msg = "Отлично! Полное владение материалом.";
    else if (correctCount >= 10) msg = "Хороший результат! Почти всё усвоено.";
    else if (correctCount >= 7) msg = "Неплохо, но есть пробелы. Стоит повторить материал.";
    else msg = "Нужно ещё подучить. Повторите СанПиН 2.1.3684-21.";
    document.getElementById("score-message").textContent = msg;
}

function resetTest() {
    document.getElementById("result-screen").classList.remove("active");
    document.getElementById("start-screen").classList.add("active");
    answers = [];
    document.getElementById("finish-btn").style.display = "none";
}
</script>
