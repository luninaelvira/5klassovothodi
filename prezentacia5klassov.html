<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Интерактив: Классы опасности отходов | Полноэкранный режим</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Убираем выделение текста при быстрых свайпах/кликах */
        }

        body {
            background: #f4f1ea;  /* Пастельный фон страницы (единый, нейтральный) */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            padding: 20px;
        }

        /* Контейнер интерактива — размер под средний размер картинок (ширина ~1000px, высота ~660px) */
        .interactive-wrapper {
            max-width: 1100px;
            width: 100%;
            transition: all 0.3s ease;
        }

        /* Основной блок интерактива */
        .interactive-container {
            width: 100%;
            background: #fef9ef;   /* Пастельный кремовый фон всей области (единый для всех слайдов) */
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
            transition: all 0.2s;
        }

        /* Карусель: flex-лента, растягивается на всю ширину контейнера */
        .carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;          /* Тонкий скроллбар для Firefox */
            background: #fef9ef;            /* Единый пастельный фон под слайдами */
            border-radius: 32px 32px 0 0;
        }

        /* Скрываем стандартный скроллбар в Chrome/Safari, но оставляем возможность скроллить */
        .carousel::-webkit-scrollbar {
            height: 6px;
            background-color: #e9e0d4;
            border-radius: 8px;
        }
        .carousel::-webkit-scrollbar-thumb {
            background-color: #c4b6a4;
            border-radius: 8px;
        }

        /* Каждый слайд — занимает 100% ширины карусели и фиксируется скролл-снапом */
        .slide {
            flex: 0 0 100%;
            scroll-snap-align: start;
            background: #fef9ef;   /* Единый пастельный фон для каждого слайда */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Изображения занимают всю доступную ширину/высоту слайда, сохраняя пропорции */
        .slide img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;    /* Вписывает картинку целиком в область слайда, без обрезания */
            background: #fef9ef;    /* Фон под картинкой — единый пастельный */
            pointer-events: none;   /* Клики сквозь картинку не мешают навигации */
        }

        /* Панель навигации (кнопки и индикаторы) в пастельных тонах */
        .nav-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px 20px 24px;
            background: #fef9ef;
            border-top: 1px solid #f0e7db;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: #e8dfd3;
            border: none;
            font-size: 1.4rem;
            font-weight: 600;
            color: #5c4b37;
            width: 44px;
            height: 44px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            font-family: monospace;
        }

        .nav-btn:hover {
            background: #d6cbbc;
            transform: scale(0.96);
        }

        .nav-btn:active {
            transform: scale(0.92);
        }

        /* индикаторы (пагинация) */
        .indicators {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #d7ccbe;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dot.active {
            background: #8b7a66;
            width: 26px;
        }

        .counter {
            font-size: 0.9rem;
            font-weight: 500;
            background: #f5efe7;
            padding: 6px 14px;
            border-radius: 40px;
            color: #5c4b37;
            letter-spacing: 0.5px;
        }

        /* Кнопка полноэкранного режима */
        .fullscreen-btn {
            background: #e8dfd3;
            border: none;
            font-size: 1.2rem;
            font-weight: 500;
            color: #5c4b37;
            width: 44px;
            height: 44px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            font-family: monospace;
        }

        .fullscreen-btn:hover {
            background: #d6cbbc;
            transform: scale(0.96);
        }

        .fullscreen-btn:active {
            transform: scale(0.92);
        }

        /* Группа правых кнопок (fullscreen + счётчик) */
        .right-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Для touch-устройств делаем чуть больше кнопки */
        @media (max-width: 680px) {
            .nav-btn, .fullscreen-btn {
                width: 50px;
                height: 50px;
                font-size: 1.7rem;
            }
            .fullscreen-btn {
                font-size: 1.5rem;
            }
            .nav-controls {
                padding: 12px 18px;
            }
            .counter {
                font-size: 0.8rem;
            }
        }

        /* Полноэкранный режим */
        .interactive-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            background: #fef9ef;
            display: flex;
            flex-direction: column;
        }

        .interactive-container:fullscreen .carousel {
            flex: 1;
            border-radius: 0;
            height: calc(100% - 80px);
        }

        .interactive-container:fullscreen .slide {
            height: 100%;
        }

        .interactive-container:fullscreen .slide img {
            width: auto;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            margin: 0 auto;
        }

        .interactive-container:fullscreen .nav-controls {
            border-radius: 0;
            padding: 16px 24px;
        }

        /* Поддержка для WebKit полноэкранного режима */
        .interactive-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            background: #fef9ef;
            display: flex;
            flex-direction: column;
        }

        .interactive-container:-webkit-full-screen .carousel {
            flex: 1;
            border-radius: 0;
            height: calc(100% - 80px);
        }

        .interactive-container:-webkit-full-screen .slide img {
            width: auto;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            margin: 0 auto;
        }

        /* Адаптация под очень широкие экраны */
        @media (min-width: 1200px) {
            .interactive-wrapper {
                max-width: 1050px;
            }
        }

        /* Декоративные элементы */
        .interactive-container {
            transition: box-shadow 0.2s;
        }
    </style>
</head>
<body>
<div class="interactive-wrapper">
    <div class="interactive-container" id="interactiveContainer">
        <!-- Карусель (листалка) -->
        <div class="carousel" id="carousel">
            <!-- слайд 1 - чрезвычайно опасные отходы -->
            <div class="slide" data-index="0">
                <img src="слайд 1.png" alt="I класс – чрезвычайно опасные отходы, Минамата">
            </div>
            <!-- слайд 2 - высокоопасные отходы -->
            <div class="slide" data-index="1">
                <img src="слайд 2.png" alt="II класс – высокоопасные отходы, Венгрия 2010">
            </div>
            <!-- слайд 3 - умеренно опасные отходы -->
            <div class="slide" data-index="2">
                <img src="слайд 3.png" alt="III класс – умеренно опасные отходы, Россия 2024">
            </div>
            <!-- слайд 4 - малоопасные отходы -->
            <div class="slide" data-index="3">
                <img src="слайд 4.png" alt="IV класс – малоопасные отходы, Калужская область 2021">
            </div>
            <!-- слайд 5 - практически неопасные отходы -->
            <div class="slide" data-index="4">
                <img src="слайд 5.png" alt="V класс – практически неопасные отходы, Большое тихоокеанское пятно">
            </div>
        </div>

        <!-- Панель с навигацией, полноэкранным режимом и единым стилем -->
        <div class="nav-controls">
            <button class="nav-btn" id="prevBtn" aria-label="Предыдущий слайд">←</button>
            <div class="indicators" id="indicators"></div>
            <div class="right-group">
                <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Полноэкранный режим">⛶</button>
                <div class="counter" id="slideCounter">1 / 5</div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // Получаем элементы
        const container = document.getElementById('interactiveContainer');
        const carousel = document.getElementById('carousel');
        const slides = document.querySelectorAll('.slide');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const indicatorsContainer = document.getElementById('indicators');
        const counterSpan = document.getElementById('slideCounter');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const totalSlides = slides.length;
        let currentIndex = 0;
        let scrollTimeout = null;
        let isFullscreen = false;

        // Функция обновления активного индикатора и счётчика
        function updateUI(index) {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                if (i === index) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
            counterSpan.innerText = `${index + 1} / ${totalSlides}`;
        }

        // Плавный скролл к нужному слайду
        function scrollToSlide(index) {
            if (index < 0) index = 0;
            if (index >= totalSlides) index = totalSlides - 1;
            const slideElement = slides[index];
            if (slideElement) {
                slideElement.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest',
                    inline: 'start'
                });
                currentIndex = index;
                updateUI(currentIndex);
            }
        }

        // Определение текущего видимого слайда на основе позиции прокрутки
        function getCurrentSlideIndex() {
            const carouselRect = carousel.getBoundingClientRect();
            if (!carouselRect.width) return 0;
            let closestIndex = 0;
            let minDistance = Infinity;
            slides.forEach((slide, idx) => {
                const rect = slide.getBoundingClientRect();
                const slideCenter = rect.left + rect.width / 2;
                const viewportCenter = carouselRect.left + carouselRect.width / 2;
                const distance = Math.abs(slideCenter - viewportCenter);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = idx;
                }
            });
            return closestIndex;
        }

        // Обработчик прокрутки для синхронизации
        function handleScroll() {
            if (scrollTimeout) clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const newIndex = getCurrentSlideIndex();
                if (newIndex !== currentIndex) {
                    currentIndex = newIndex;
                    updateUI(currentIndex);
                }
            }, 60);
        }

        // Добавляем обработчик прокрутки
        carousel.addEventListener('scroll', handleScroll);

        // Обработка изменения размера окна (для корректировки индекса)
        let resizeTimer;
        window.addEventListener('resize', function() {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const newIdx = getCurrentSlideIndex();
                if (newIdx !== currentIndex) {
                    currentIndex = newIdx;
                    updateUI(currentIndex);
                }
            }, 100);
        });

        // Кнопки навигации
        function nextSlide() {
            if (currentIndex < totalSlides - 1) {
                scrollToSlide(currentIndex + 1);
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                scrollToSlide(currentIndex - 1);
            }
        }

        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);

        // Создание индикаторов (пагинация)
        function createIndicators() {
            indicatorsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (i === 0) dot.classList.add('active');
                dot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    scrollToSlide(i);
                });
                indicatorsContainer.appendChild(dot);
            }
        }

        createIndicators();

        // Инициализация позиции: первый слайд
        setTimeout(() => {
            if (carousel.scrollLeft !== 0) {
                scrollToSlide(0);
            } else {
                const firstIndex = getCurrentSlideIndex();
                if (firstIndex !== 0) {
                    scrollToSlide(0);
                } else {
                    currentIndex = 0;
                    updateUI(0);
                }
            }
        }, 20);

        // Поддержка клавиш (стрелки влево/вправо)
        window.addEventListener('keydown', (e) => {
            // Игнорируем, если активен полноэкранный режим, но стрелки работают в любом случае
            if (e.key === 'ArrowLeft') {
                prevSlide();
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                nextSlide();
                e.preventDefault();
            } else if (e.key === 'f' || e.key === 'F' || (e.key === 'Enter' && (e.ctrlKey || e.metaKey))) {
                // Дополнительный хоткей для удобства: F или Ctrl+Enter
                toggleFullscreen();
                e.preventDefault();
            }
        });

        // ==================== ПОЛНОЭКРАННЫЙ РЕЖИМ ====================
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // Входим в полноэкранный режим
                const elem = container;
                const requestMethod = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.msRequestFullscreen;
                if (requestMethod) {
                    requestMethod.call(elem).catch(err => {
                        console.warn(`Ошибка полноэкранного режима: ${err.message}`);
                    });
                }
            } else {
                // Выходим из полноэкранного режима
                const exitMethod = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if (exitMethod) {
                    exitMethod.call(document);
                }
            }
        }

        // Обработчик кнопки полноэкранного режима
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Отслеживаем изменение полноэкранного режима, чтобы обновить иконку и стили при необходимости
        function onFullscreenChange() {
            const isCurrentlyFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
            isFullscreen = isCurrentlyFullscreen;
            // Меняем иконку кнопки в зависимости от режима
            if (isFullscreen) {
                fullscreenBtn.textContent = '✖';
                fullscreenBtn.setAttribute('aria-label', 'Выйти из полноэкранного режима');
                fullscreenBtn.title = 'Выйти из полноэкранного режима (Esc)';
            } else {
                fullscreenBtn.textContent = '⛶';
                fullscreenBtn.setAttribute('aria-label', 'Полноэкранный режим');
                fullscreenBtn.title = 'Полноэкранный режим (F)';
            }
            // При изменении полноэкранного режима обновляем позицию скролла, чтобы слайд оставался корректным
            setTimeout(() => {
                const newIdx = getCurrentSlideIndex();
                if (newIdx !== currentIndex) {
                    currentIndex = newIdx;
                    updateUI(currentIndex);
                }
                // Принудительно пересчитываем скролл для корректного отображения текущего слайда
                if (slides[currentIndex]) {
                    slides[currentIndex].scrollIntoView({
                        behavior: 'auto',
                        block: 'nearest',
                        inline: 'start'
                    });
                }
            }, 50);
        }

        // Подписываемся на события полноэкранного режима (для разных браузеров)
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
        document.addEventListener('msfullscreenchange', onFullscreenChange);

        // Дополнительная настройка для корректной работы при выходе по ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && (document.fullscreenElement || document.webkitFullscreenElement)) {
                // Выход будет обработан системой, но обновим состояние UI после события
                setTimeout(() => {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        fullscreenBtn.textContent = '⛶';
                        fullscreenBtn.setAttribute('aria-label', 'Полноэкранный режим');
                        // Также обновляем позицию слайда
                        const idx = getCurrentSlideIndex();
                        if (idx !== currentIndex) {
                            currentIndex = idx;
                            updateUI(currentIndex);
                        }
                    }
                }, 100);
            }
        });

        // Фикс для скролл-снапа в полноэкранном режиме
        const style = document.createElement('style');
        style.textContent = `
            .carousel {
                scroll-snap-type: x mandatory;
                scroll-padding: 0;
            }
            .slide {
                scroll-snap-align: start;
            }
            /* Дополнительный стиль для полноэкранного режима: улучшаем отображение картинок */
            .interactive-container:fullscreen .slide img,
            .interactive-container:-webkit-full-screen .slide img {
                cursor: default;
            }
            .interactive-container:fullscreen .carousel,
            .interactive-container:-webkit-full-screen .carousel {
                overflow-x: auto;
            }
        `;
        document.head.appendChild(style);

        // Добавляем поддержку жестов и touch-событий (уже есть через scroll)
        // Чтобы при перевороте экрана или изменении размера карусель не теряла индекс
        
        // Дополнительно: если пользователь кликает на кнопку fullscreen во время скролла, ничего не ломается.
        // Обновляем UI при любых изменениях карусели через MutationObserver (на всякий случай)
        const observer = new ResizeObserver(() => {
            const idx = getCurrentSlideIndex();
            if (idx !== currentIndex) {
                currentIndex = idx;
                updateUI(currentIndex);
            }
        });
        observer.observe(carousel);
    })();
</script>
</body>
</html>
