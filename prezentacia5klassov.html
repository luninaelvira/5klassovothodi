<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Интерактив: Классы опасности отходов | Навигация + Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #fffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            padding: 20px;
        }

        /* Обёртка интерактива */
        .interactive-wrapper {
            max-width: 1100px;
            width: 100%;
            transition: all 0.3s ease;
        }

        /* Основной блок */
        .interactive-container {
            width: 100%;
            background: #fef9ef;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }

        /* Карусель */
        .carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            background: #fef9ef;
        }

        .carousel::-webkit-scrollbar {
            height: 6px;
            background-color: #e9e0d4;
            border-radius: 8px;
        }
        .carousel::-webkit-scrollbar-thumb {
            background-color: #c4b6a4;
            border-radius: 8px;
        }

        /* Слайд */
        .slide {
            flex: 0 0 100%;
            scroll-snap-align: start;
            background: #fef9ef;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            background: #fef9ef;
            pointer-events: none;
        }

        /* Панель навигации — здесь есть обе кнопки: "Назад" и "Вперёд" */
        .nav-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px 20px 24px;
            background: #fef9ef;
            border-top: 1px solid #f0e7db;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* Группа левых кнопок (только "Назад") */
        .left-group {
            display: flex;
            gap: 8px;
        }

        /* Группа правых кнопок (Fullscreen + счётчик) */
        .right-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Стиль для кнопок навигации и полноэкранного режима */
        .nav-btn {
            background: #e8dfd3;
            border: none;
            font-size: 1.4rem;
            font-weight: 600;
            color: #5c4b37;
            width: 48px;
            height: 48px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            font-family: monospace;
        }

        .fullscreen-btn {
            background: #e8dfd3;
            border: none;
            font-size: 1.3rem;
            font-weight: 500;
            color: #5c4b37;
            width: 48px;
            height: 48px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .nav-btn:hover, .fullscreen-btn:hover {
            background: #d6cbbc;
            transform: scale(0.96);
        }

        .nav-btn:active, .fullscreen-btn:active {
            transform: scale(0.92);
        }

        /* Индикаторы (точки) */
        .indicators {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #d7ccbe;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dot.active {
            background: #8b7a66;
            width: 26px;
        }

        /* Счётчик слайдов */
        .counter {
            font-size: 0.9rem;
            font-weight: 500;
            background: #f5efe7;
            padding: 6px 14px;
            border-radius: 40px;
            color: #5c4b37;
            letter-spacing: 0.5px;
        }

        /* Мобильная адаптация */
        @media (max-width: 680px) {
            .nav-btn, .fullscreen-btn {
                width: 48px;
                height: 48px;
                font-size: 1.5rem;
            }
            .nav-controls {
                padding: 12px 18px;
                gap: 10px;
            }
            .counter {
                font-size: 0.8rem;
                padding: 5px 12px;
            }
            .indicators {
                gap: 8px;
            }
        }

        /* Полноэкранный режим */
        .interactive-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            background: #fef9ef;
            display: flex;
            flex-direction: column;
        }

        .interactive-container:fullscreen .carousel {
            flex: 1;
            border-radius: 0;
            height: calc(100% - 85px);
        }

        .interactive-container:fullscreen .slide {
            height: 100%;
        }

        .interactive-container:fullscreen .slide img {
            width: auto;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            margin: 0 auto;
        }

        .interactive-container:fullscreen .nav-controls {
            border-radius: 0;
        }

        /* WebKit fullscreen */
        .interactive-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            background: #fef9ef;
            display: flex;
            flex-direction: column;
        }

        .interactive-container:-webkit-full-screen .carousel {
            flex: 1;
            height: calc(100% - 85px);
        }

        .interactive-container:-webkit-full-screen .slide img {
            width: auto;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            margin: 0 auto;
        }

        /* Предельная ширина для больших экранов */
        @media (min-width: 1200px) {
            .interactive-wrapper {
                max-width: 1050px;
            }
        }
    </style>
</head>
<body>
<div class="interactive-wrapper">
    <div class="interactive-container" id="interactiveContainer">
        <!-- Карусель (листалка) -->
        <div class="carousel" id="carousel">
            <div class="slide" data-index="0">
                <img src="слайд 1.png">
            </div>
            <div class="slide" data-index="1">
                <img src="слайд 2.png" alt="II класс – высокоопасные отходы, Венгрия 2010">
            </div>
            <div class="slide" data-index="2">
                <img src="слайд 3.png" alt="III класс – умеренно опасные отходы, Россия 2024">
            </div>
            <div class="slide" data-index="3">
                <img src="слайд 4.png" alt="IV класс – малоопасные отходы, Калужская область 2021">
            </div>
            <div class="slide" data-index="4">
                <img src="слайд 5.png" alt="V класс – практически неопасные отходы, Большое тихоокеанское пятно">
            </div>
        </div>

        <!-- Панель управления: слева кнопка НАЗАД, центр — индикаторы, справа — кнопка ВПЕРЁД + FULLSCREEN + счётчик -->
        <div class="nav-controls">
            <!-- Кнопка "Предыдущий слайд" -->
            <div class="left-group">
                <button class="nav-btn" id="prevBtn" aria-label="Предыдущий слайд" title="Назад (←)">←</button>
            </div>

            <!-- Индикаторы (точки) -->
            <div class="indicators" id="indicators"></div>

            <!-- Правая группа: кнопка "Следующий слайд", полноэкранный режим и счётчик -->
            <div class="right-group">
                <button class="nav-btn" id="nextBtn" aria-label="Следующий слайд" title="Вперёд (→)">→</button>
                <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Полноэкранный режим" title="Полноэкранный режим (F)">⛶</button>
                <div class="counter" id="slideCounter">1 / 5</div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // DOM элементы
        const container = document.getElementById('interactiveContainer');
        const carousel = document.getElementById('carousel');
        const slides = document.querySelectorAll('.slide');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const indicatorsContainer = document.getElementById('indicators');
        const counterSpan = document.getElementById('slideCounter');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const totalSlides = slides.length;
        let currentIndex = 0;
        let scrollTimeout = null;

        // Обновление UI (точки + счётчик)
        function updateUI(index) {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                if (i === index) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
            counterSpan.innerText = `${index + 1} / ${totalSlides}`;
        }

        // Плавная прокрутка к слайду
        function scrollToSlide(index) {
            if (index < 0) index = 0;
            if (index >= totalSlides) index = totalSlides - 1;
            const slideElement = slides[index];
            if (slideElement) {
                slideElement.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest',
                    inline: 'start'
                });
                currentIndex = index;
                updateUI(currentIndex);
            }
        }

        // Определение текущего видимого слайда по центру вьюпорта карусели
        function getCurrentSlideIndex() {
            const carouselRect = carousel.getBoundingClientRect();
            if (!carouselRect.width) return 0;
            let closestIndex = 0;
            let minDistance = Infinity;
            slides.forEach((slide, idx) => {
                const rect = slide.getBoundingClientRect();
                const slideCenter = rect.left + rect.width / 2;
                const viewportCenter = carouselRect.left + carouselRect.width / 2;
                const distance = Math.abs(slideCenter - viewportCenter);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = idx;
                }
            });
            return closestIndex;
        }

        // Синхронизация индекса при прокрутке
        function handleScroll() {
            if (scrollTimeout) clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const newIndex = getCurrentSlideIndex();
                if (newIndex !== currentIndex) {
                    currentIndex = newIndex;
                    updateUI(currentIndex);
                }
            }, 60);
        }

        carousel.addEventListener('scroll', handleScroll);

        // Пересчёт при изменении размера окна
        let resizeTimer;
        window.addEventListener('resize', () => {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const newIdx = getCurrentSlideIndex();
                if (newIdx !== currentIndex) {
                    currentIndex = newIdx;
                    updateUI(currentIndex);
                }
            }, 100);
        });

        // КНОПКИ НАВИГАЦИИ — ВПЕРЁД И НАЗАД (явно присутствуют)
        function nextSlide() {
            if (currentIndex < totalSlides - 1) {
                scrollToSlide(currentIndex + 1);
            } else {
                // Опционально: можно сделать зацикленную карусель, но по ТЗ просто перелистывание до конца
                // Легкая визуальная подсказка, что слайд последний (необязательно)
                if (currentIndex === totalSlides - 1) {
                    // Просто ничего не делаем
                    return;
                }
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                scrollToSlide(currentIndex - 1);
            }
        }

        // Назначаем обработчики на кнопки
        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);

        // Создание точек-индикаторов
        function createIndicators() {
            indicatorsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (i === 0) dot.classList.add('active');
                dot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    scrollToSlide(i);
                });
                indicatorsContainer.appendChild(dot);
            }
        }
        createIndicators();

        // Инициализация: первый слайд активен
        setTimeout(() => {
            if (carousel.scrollLeft !== 0) {
                scrollToSlide(0);
            } else {
                const firstIndex = getCurrentSlideIndex();
                if (firstIndex !== 0) {
                    scrollToSlide(0);
                } else {
                    currentIndex = 0;
                    updateUI(0);
                }
            }
        }, 20);

        // Горячие клавиши: стрелки влево/вправо
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                prevSlide();
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                nextSlide();
                e.preventDefault();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
                e.preventDefault();
            }
        });

        // ==================== ПОЛНОЭКРАННЫЙ РЕЖИМ ====================
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const elem = container;
                const requestMethod = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.msRequestFullscreen;
                if (requestMethod) {
                    requestMethod.call(elem).catch(err => {
                        console.warn(`Ошибка fullscreen: ${err.message}`);
                    });
                }
            } else {
                const exitMethod = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if (exitMethod) {
                    exitMethod.call(document);
                }
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Обработчик изменения полноэкранного режима
        function onFullscreenChange() {
            const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (isFullscreen) {
                fullscreenBtn.textContent = '✖';
                fullscreenBtn.setAttribute('aria-label', 'Выйти из полноэкранного режима');
                fullscreenBtn.title = 'Выйти (Esc)';
            } else {
                fullscreenBtn.textContent = '⛶';
                fullscreenBtn.setAttribute('aria-label', 'Полноэкранный режим');
                fullscreenBtn.title = 'Полноэкранный режим (F)';
            }
            // Обновляем позицию слайда после смены режима
            setTimeout(() => {
                const newIdx = getCurrentSlideIndex();
                if (newIdx !== currentIndex) {
                    currentIndex = newIdx;
                    updateUI(currentIndex);
                }
                // Дополнительно подкручиваем к текущему слайду
                if (slides[currentIndex]) {
                    slides[currentIndex].scrollIntoView({
                        behavior: 'auto',
                        block: 'nearest',
                        inline: 'start'
                    });
                }
            }, 50);
        }

        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);

        // Доп. стили для полноэкранного режима
        const style = document.createElement('style');
        style.textContent = `
            .carousel {
                scroll-snap-type: x mandatory;
                scroll-padding: 0;
            }
            .slide {
                scroll-snap-align: start;
            }
            .interactive-container:fullscreen .carousel,
            .interactive-container:-webkit-full-screen .carousel {
                overflow-x: auto;
            }
        `;
        document.head.appendChild(style);

        // Наблюдатель за изменением размера карусели (на случай поворотов экрана)
        const observer = new ResizeObserver(() => {
            const idx = getCurrentSlideIndex();
            if (idx !== currentIndex) {
                currentIndex = idx;
                updateUI(currentIndex);
            }
        });
        observer.observe(carousel);
    })();
</script>
</body>
</html>
