<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перевёртыш 700px</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #fffff;
            font-family: Arial, sans-serif;
        }

        .flip-container {
            width: 700px;
            height: 500px;
            perspective: 1000px;
        }

        .flip-card {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .flip-container:hover .flip-card {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
        }

        .flip-card-front {
            transform: rotateY(0deg);
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }

        .flip-card-front img,
        .flip-card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Подпись для тестового режима */
        .test-label {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="flip-container">
    <div class="flip-card">
        <!-- ЛИЦЕВАЯ СТОРОНА -->
        <div class="flip-card-front">
            <img src="https://via.placeholder.com/700x500/1a2a6c/ffffff?text=ЛИЦЕВАЯ+СТОРОНА" alt="Лицевая сторона">
            <div class="test-label">"kartinka1.png"</div>
        </div>

        <!-- ОБОРОТНАЯ СТОРОНА -->
        <div class="flip-card-back">
            <img src="https://via.placeholder.com/700x500/0d1b2a/ffd700?text=ОБОРОТНАЯ+СТОРОНА" alt="Оборотная сторона">
            <div class="test-label">"kartinka2.png"</div>
        </div>
    </div>
</div>

</body>
</html>
